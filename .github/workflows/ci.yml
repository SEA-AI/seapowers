name: CI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: |
            skills/**
            .claude-plugin/**

      - name: Check version bumps and semver
        if: steps.changed.outputs.any_changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          base="origin/$BASE_REF"
          git fetch origin "$BASE_REF" --depth=1
          changed=$(git diff --name-only "$base"...HEAD)

          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          new=$(jq -r .version .claude-plugin/plugin.json)
          [[ $new =~ $semver ]] || { echo "❌ Invalid semver in .claude-plugin/plugin.json: $new"; exit 1; }

          # plugin.json is the only version; a second one in marketplace.json silently loses to it
          extra=$(jq -r '[.metadata.version?, (.plugins[]?.version)] | map(select(. != null)) | length' .claude-plugin/marketplace.json)
          [ "$extra" = 0 ] || { echo "❌ .claude-plugin/marketplace.json sets a version; keep it only in .claude-plugin/plugin.json"; exit 1; }

          if echo "$changed" | grep -qE '^skills/'; then
            old=$(git show "$base:.claude-plugin/plugin.json" | jq -r .version)
            [ "$old" != "$new" ] || { echo "❌ Skills changed but .claude-plugin/plugin.json version not bumped ($old)"; exit 1; }
            echo "✅ Skills: $old → $new"
          fi

      - name: Post version-check result
        if: always() && steps.changed.outputs.any_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: version-check
          message: |
            ${{ job.status == 'success' && '✅ **Version Check Passed**' || '❌ **Version Check Failed**' }}

            **Bump rules:**
            - The only version lives in `.claude-plugin/plugin.json`; bump it when skills change
            - `.claude-plugin/marketplace.json` must not set any `version`
            - Format: semantic versioning (`X.Y.Z`)

            **Semver guide:** `PATCH` = fixes · `MINOR` = features · `MAJOR` = breaking

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: |
            skills/**
            .claude-plugin/**

      - name: Get changed SKILL.md files
        id: changed-skills
        if: steps.changed.outputs.any_changed == 'true'
        uses: tj-actions/changed-files@v47
        with:
          files: 'skills/**/SKILL.md'
          json: "true"

      - name: Get changed markdown files
        id: changed-md
        if: steps.changed.outputs.any_changed == 'true'
        uses: tj-actions/changed-files@v47
        with:
          files: '**/*.md'
          json: "true"

      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.any_changed == 'true'

      - name: Check descriptions
        id: descriptions
        if: steps.changed-skills.outputs.any_changed == 'true'
        continue-on-error: true
        env:
          CHANGED_SKILLS: ${{ steps.changed-skills.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          mapfile -t skill_files < <(jq -er '.[]' <<< "${CHANGED_SKILLS//\\\"/\"}")

          {
            echo "| Skill | Description (chars / 1024) | Status |"
            echo "|---|---|---|"
          } > descriptions.md

          fail=0
          for file in "${skill_files[@]}"; do
            frontmatter=$(awk '/^---[[:space:]]*$/ { c++; next } c == 1' "$file")
            desc_len=$(echo "$frontmatter" | yq -r '.description // ""' | tr -d '\n' | wc -c)
            status="✅"
            [ "$desc_len" -le 1024 ] || { status="❌"; fail=1; }
            echo "| \`$file\` | $desc_len | $status |" >> descriptions.md
          done

          { echo 'table<<EOF'; cat descriptions.md; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          exit $fail

      - name: Check tokens
        id: tokens
        if: steps.changed.outputs.any_changed == 'true'
        continue-on-error: true
        env:
          CHANGED_MD: ${{ steps.changed-md.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          mapfile -t md_files < <(jq -er '.[]' <<< "${CHANGED_MD//\\\"/\"}")

          if [ ${#md_files[@]} -eq 0 ]; then
            echo 'table=_No markdown files modified._' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "| File | Tokens | Limit | Status |"
            echo "|---|---|---|---|"
          } > tokens.md

          fail=0
          readarray -t token_counts < <(uv run .github/scripts/count_tokens.py "${md_files[@]}")

          for i in "${!md_files[@]}"; do
            file="${md_files[$i]}"
            tokens="${token_counts[$i]}"
            if [[ "$file" == */SKILL.md ]]; then
              [ "$tokens" -le 5000 ] && status="✅" || { status="❌"; fail=1; }
              echo "| \`$file\` | $tokens | 5000 | $status |" >> tokens.md
            else
              echo "| \`$file\` | $tokens | — | ℹ️ |" >> tokens.md
            fi
          done

          { echo 'table<<EOF'; cat tokens.md; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          exit $fail

      - name: Post skill-lint result
        if: always() && steps.changed.outputs.any_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: skill-lint
          message: |
            ${{ (steps.descriptions.outcome != 'failure' && steps.tokens.outcome == 'success') && '✅ **Skill Lint Passed**' || '❌ **Skill Lint Failed**' }}

            #### Descriptions
            ${{ steps.descriptions.outcome == 'skipped' && '_No SKILL.md files modified._' || steps.descriptions.outputs.table }}

            #### Tokens
            ${{ steps.tokens.outputs.table }}

            _`description` ≤ 1024 chars · `SKILL.md` body ≤ 5000 tokens via `tiktoken cl100k_base` · [Anthropic best practices](https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices)_

      - name: Evaluate
        if: always() && steps.changed.outputs.any_changed == 'true'
        run: |
          [[ "${{ steps.descriptions.outcome }}" != "failure" && \
             "${{ steps.tokens.outcome }}"       != "failure" ]] || exit 1
